<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotkey Command Center</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        notion: {
                            main: '#191919',
                            sidebar: '#202020',
                            hover: '#2c2c2c',
                            border: '#2f2f2f',
                            text: 'rgba(255, 255, 255, 0.81)',
                            muted: 'rgba(255, 255, 255, 0.44)',
                            key: '#2f2f2f',
                            keyborder: '#373737'
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Helvetica', '"Apple Color Emoji"', 'Arial', 'sans-serif', '"Segoe UI Emoji"', '"Segoe UI Symbol"'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #191919;
            color: rgba(255, 255, 255, 0.81);
        }

        /* Notion-style flat sharp keys */
        .kbd {
            display: inline-block;
            padding: 0.15rem 0.4rem;
            font-size: 0.85rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            color: rgba(255, 255, 255, 0.81);
            background-color: #2f2f2f;
            border: 1px solid #373737;
            border-radius: 0px; 
            margin: 0 0.1rem;
            transition: background-color 0.1s ease;
        }

        /* Custom Scrollbar to match Notion */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #474c50; 
            border: 2px solid #191919;
            border-radius: 0px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #5a6065; 
        }
        
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        input:focus {
            outline: none;
            box-shadow: none;
        }
    </style>
</head>
<body class="h-screen flex overflow-hidden selection:bg-notion-hover selection:text-white font-sans relative">

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-notion-sidebar border border-notion-border text-notion-text px-4 py-3 shadow-2xl transition-all duration-200 translate-y-20 opacity-0 z-50 flex items-center gap-3 text-sm">
        <i data-lucide="check" class="w-4 h-4 text-notion-muted"></i>
        <span id="toast-message">Copied to clipboard</span>
    </div>

    <!-- Mobile Toggle Button -->
    <button id="mobile-menu-btn" class="md:hidden fixed bottom-4 right-4 z-50 bg-notion-border p-3 rounded-full border border-notion-keyborder shadow-xl text-white">
        <i data-lucide="menu" class="w-5 h-5"></i>
    </button>

    <!-- Sidebar -->
    <aside id="sidebar" class="absolute md:relative -translate-x-full md:translate-x-0 w-64 bg-notion-sidebar border-r border-notion-border flex flex-col z-40 h-full flex-shrink-0 transition-transform duration-200 ease-in-out">
        <div class="p-4 border-b border-notion-border flex items-center gap-2">
            <div class="p-1 bg-notion-text text-notion-main">
                <i data-lucide="command" class="w-4 h-4"></i>
            </div>
            <h1 class="text-sm font-semibold text-notion-text">HotkeyMaster</h1>
        </div>
        
        <div class="flex-1 overflow-y-auto no-scrollbar py-2">
            <div class="px-3 mb-1 text-[11px] font-semibold text-notion-muted uppercase tracking-wider">
                Software
            </div>
            <nav id="software-list" class="flex flex-col">
                <!-- Populated by JS -->
            </nav>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full relative overflow-hidden bg-notion-main w-full">
        
        <!-- Header & Search -->
        <header class="h-14 border-b border-notion-border flex items-center px-4 md:px-6 flex-shrink-0 z-10 bg-notion-main">
            <h2 id="current-software-title" class="text-lg font-medium text-notion-text flex-1 flex items-center gap-2 truncate pr-4">
                Loading...
            </h2>
            
            <div class="flex items-center gap-2">
                <div class="relative w-40 md:w-72 flex items-center">
                    <i data-lucide="search" class="absolute left-3 text-notion-muted w-4 h-4"></i>
                    <input type="text" id="search-bar" placeholder="Search..." 
                        class="w-full bg-transparent border border-transparent text-notion-text text-sm py-1.5 pl-9 pr-3 hover:bg-notion-hover focus:bg-notion-hover transition-colors placeholder-notion-muted">
                </div>
                <button id="filter-toggle-btn" class="hidden p-1.5 text-notion-muted hover:bg-notion-hover hover:text-notion-text rounded transition-colors" title="Toggle Filters">
                    <i data-lucide="filter" class="w-4 h-4"></i>
                </button>
            </div>
        </header>

        <!-- Category Filter Bar (Compact) -->
        <div id="category-bar" class="flex flex-wrap items-center py-2 px-4 md:px-6 border-b border-notion-border bg-notion-main gap-1.5 flex-shrink-0 hidden">
            <!-- Populated by JS -->
        </div>

        <!-- Scrollable Content Area -->
        <div class="flex-1 overflow-y-auto" id="main-content">
            
            <!-- Favorites Section -->
            <div id="favorites-section" class="border-b border-notion-border pb-6 pt-6 px-4 md:px-6 hidden">
                <div class="flex items-center gap-2 text-sm font-medium text-notion-text mb-2">
                    <i data-lucide="star" class="w-4 h-4 text-yellow-500 fill-yellow-500"></i> 
                    Favorites
                </div>
                <div class="border border-notion-border">
                    <div id="favorites-list" class="flex flex-col">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>

            <div id="category-section" class="pb-10 pt-6 px-4 md:px-6">
                <!-- Populated by JS -->
            </div>

            <div id="empty-state" class="hidden flex-col items-center justify-center h-full text-notion-muted">
                <i data-lucide="search-x" class="w-8 h-8 mb-3 opacity-50"></i>
                <p class="text-sm">No results found.</p>
            </div>

        </div>
    </main>

    <script>
        // --- 1. STATE INITIALIZATION ---
        let hotkeyDatabase = [];
        let currentSoftware = "";
        let searchQuery = "";
        let selectedCategory = "All";
        let softwareList = [];
        let currentAvailableCategories = [];
        let showCategoryFilters = false;
        
        let favorites = [];
        try {
            const saved = localStorage.getItem('hotkey-favorites');
            if (saved) favorites = JSON.parse(saved);
        } catch (e) {}

        const DATA_URL = 'https://raw.githubusercontent.com/ken-odonnell/hotkey-master/refs/heads/main/data.json';

        // Load data from external JSON file
        async function initializeData() {
            try {
                const response = await fetch(DATA_URL);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                hotkeyDatabase = await response.json();
                
                softwareList = [...new Set(hotkeyDatabase.map(item => item.software).filter(Boolean))];
                if (!softwareList.includes(currentSoftware) && softwareList.length > 0) {
                    currentSoftware = softwareList[0];
                }
                
                updateAvailableCategories();
                renderSidebar();
                renderCategoryBar();
                renderContent();
            } catch (error) {
                console.error("Could not load data.json:", error);
                document.getElementById('current-software-title').innerHTML = "Error loading data";
                const emptyState = document.getElementById('empty-state');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                emptyState.innerHTML = `<i data-lucide="alert-circle" class="w-8 h-8 mb-3 text-red-500 opacity-50"></i><p class="text-sm">Failed to load data.json. Ensure file exists and is valid.</p>`;
                lucide.createIcons();
            }
        }

        // --- 2. DOM ELEMENTS ---
        const softwareListEl = document.getElementById('software-list');
        const currentSoftwareTitleEl = document.getElementById('current-software-title');
        const searchInputEl = document.getElementById('search-bar');
        const categoryBarEl = document.getElementById('category-bar');
        const favoritesSectionEl = document.getElementById('favorites-section');
        const favoritesListEl = document.getElementById('favorites-list');
        const categorySectionEl = document.getElementById('category-section');
        const emptyStateEl = document.getElementById('empty-state');
        const toastEl = document.getElementById('toast');
        const toastMessageEl = document.getElementById('toast-message');
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const sidebarEl = document.getElementById('sidebar');
        const filterToggleBtn = document.getElementById('filter-toggle-btn');

        // --- 3. HELPER FUNCTIONS ---
        function getUniqueId(item) {
            return `${item.software}||${item.category}||${item.action}`;
        }

        function formatKeyCombo(keyString) {
            if(!keyString) return '';
            const parts = keyString.split(/(\s*\+\s*|\s*\/\s*)/);
            return parts.map(part => {
                if (part.trim() === '+' || part.trim() === '/') {
                    return `<span class="text-notion-muted mx-1 text-[11px]">${part.trim()}</span>`;
                }
                if(!part.trim()) return '';
                return `<span class="kbd">${part.trim()}</span>`;
            }).join('');
        }

        function updateAvailableCategories() {
            const items = hotkeyDatabase.filter(item => item.software === currentSoftware);
            const cats = new Set(items.map(item => item.category || 'General'));
            currentAvailableCategories = Array.from(cats).sort();
        }

        // --- 4. GLOBAL EVENTS ---
        window.toggleFavorite = function(e, idStr) {
            e.stopPropagation(); // Prevent copy action
            if (favorites.includes(idStr)) {
                favorites = favorites.filter(fav => fav !== idStr);
            } else {
                favorites.push(idStr);
            }
            localStorage.setItem('hotkey-favorites', JSON.stringify(favorites));
            renderContent();
        };

        // --- 5. RENDER LOGIC ---
        function renderSidebar() {
            softwareListEl.innerHTML = '';
            softwareList.forEach(software => {
                const btn = document.createElement('button');
                const isActive = software === currentSoftware;
                
                btn.className = `w-full text-left px-3 py-1.5 text-sm transition-none flex items-center gap-2 ${
                    isActive ? 'bg-notion-hover text-notion-text font-medium' : 'text-notion-muted hover:bg-notion-hover hover:text-notion-text'
                }`;
                
                let icon = 'monitor';
                const nameLow = software.toLowerCase();
                if(nameLow.includes("unreal")) icon = 'gamepad-2';
                else if(nameLow.includes("davinci") || nameLow.includes("potplayer")) icon = 'film';
                else if(nameLow.includes("blender") || nameLow.includes("maya") || nameLow.includes("houdini")) icon = 'box';
                else if(nameLow.includes("affinity")) icon = 'pen-tool';
                else if(nameLow.includes("windows") || nameLow.includes("powertoys")) icon = 'cpu';
                else if(nameLow.includes("sharex")) icon = 'camera';

                btn.innerHTML = `
                    <i data-lucide="${icon}" class="w-4 h-4 ${isActive ? 'text-notion-text' : 'text-notion-muted'}"></i>
                    <span class="truncate">${software}</span>
                `;
                
                btn.onclick = () => {
                    currentSoftware = software;
                    searchInputEl.value = "";
                    searchQuery = "";
                    selectedCategory = "All";
                    updateAvailableCategories();
                    
                    // Close mobile menu
                    sidebarEl.classList.add('-translate-x-full');
                    mobileMenuBtn.innerHTML = '<i data-lucide="menu" class="w-5 h-5"></i>';
                    lucide.createIcons();

                    renderSidebar();
                    renderCategoryBar();
                    renderContent();
                };
                softwareListEl.appendChild(btn);
            });
            lucide.createIcons();
        }

        function renderCategoryBar() {
            categoryBarEl.innerHTML = '';
            
            if (currentAvailableCategories.length <= 1) {
                filterToggleBtn.classList.add('hidden');
                categoryBarEl.classList.add('hidden');
                categoryBarEl.classList.remove('flex');
                return;
            }
            
            filterToggleBtn.classList.remove('hidden');

            if (!showCategoryFilters) {
                categoryBarEl.classList.add('hidden');
                categoryBarEl.classList.remove('flex');
                return;
            }

            categoryBarEl.classList.remove('hidden');
            categoryBarEl.classList.add('flex');

            const allBtn = document.createElement('button');
            const isAll = selectedCategory === 'All';
            allBtn.className = `px-2.5 py-1 text-xs rounded transition-colors ${isAll ? 'bg-notion-border text-notion-text border border-notion-keyborder' : 'text-notion-muted hover:bg-notion-hover hover:text-notion-text border border-transparent'}`;
            allBtn.innerText = 'All Categories';
            allBtn.onclick = () => { selectedCategory = 'All'; renderCategoryBar(); renderContent(); };
            categoryBarEl.appendChild(allBtn);

            currentAvailableCategories.forEach(cat => {
                const btn = document.createElement('button');
                const isCat = selectedCategory === cat;
                btn.className = `px-2.5 py-1 text-xs rounded transition-colors ${isCat ? 'bg-notion-border text-notion-text border border-notion-keyborder' : 'text-notion-muted hover:bg-notion-hover hover:text-notion-text border border-transparent'}`;
                btn.innerText = cat;
                btn.onclick = () => { selectedCategory = cat; renderCategoryBar(); renderContent(); };
                categoryBarEl.appendChild(btn);
            });
        }

        function createRowHTML(item, isLast = false, showCategory = false) {
            const borderClass = isLast ? '' : 'border-b border-notion-border';
            const idStr = getUniqueId(item);
            const isFav = favorites.includes(idStr);
            const starClass = isFav ? 'fill-yellow-500 text-yellow-500' : '';
            
            // Escape quotes to prevent breaking the onclick attribute
            const safeKey = item.key ? item.key.replace(/'/g, "\\'") : "";
            const safeId = idStr.replace(/'/g, "\\'");

            const catHtml = (showCategory && item.category) 
                ? `<div class="text-[10px] text-notion-muted uppercase mt-0.5 tracking-wider">${item.category}</div>` 
                : '';

            return `
                <div class="flex items-center justify-between p-2.5 hover:bg-notion-hover cursor-pointer group transition-none ${borderClass}" onclick="copyToClipboard('${safeKey}')">
                    <div class="flex items-center gap-3 pr-4">
                        <button onclick="toggleFavorite(event, '${safeId}')" class="text-notion-muted hover:text-yellow-500 transition-colors focus:outline-none" title="Toggle Favorite">
                            <i data-lucide="star" class="w-4 h-4 ${starClass}"></i>
                        </button>
                        <div class="flex flex-col">
                            <div class="text-sm text-notion-text">${item.action}</div>
                            ${catHtml}
                        </div>
                    </div>
                    <div class="flex items-center gap-4 shrink-0">
                        <div class="flex items-center">
                            ${formatKeyCombo(item.key)}
                        </div>
                        <div class="w-4 h-4 opacity-0 group-hover:opacity-100 transition-opacity text-notion-muted flex-shrink-0">
                            <i data-lucide="copy" class="w-4 h-4"></i>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderContent() {
            currentSoftwareTitleEl.innerHTML = currentSoftware || "No Data";

            let filteredData = hotkeyDatabase.filter(item => item.software === currentSoftware);
            
            // Apply Category Filter
            if (selectedCategory !== 'All') {
                filteredData = filteredData.filter(item => (item.category || 'General') === selectedCategory);
            }

            // Apply Search Filter
            if (searchQuery) {
                const query = searchQuery.toLowerCase();
                filteredData = filteredData.filter(item => 
                    (item.action && item.action.toLowerCase().includes(query)) || 
                    (item.key && item.key.toLowerCase().includes(query)) ||
                    (item.category && item.category.toLowerCase().includes(query))
                );
            }

            if (filteredData.length === 0) {
                favoritesSectionEl.classList.add('hidden');
                categorySectionEl.classList.add('hidden');
                emptyStateEl.classList.remove('hidden');
                emptyStateEl.classList.add('flex');
                lucide.createIcons();
                return;
            } else {
                emptyStateEl.classList.add('hidden');
                emptyStateEl.classList.remove('flex');
                categorySectionEl.classList.remove('hidden');
            }

            // Render Favorites (only if no active search)
            const favoriteItems = filteredData.filter(item => favorites.includes(getUniqueId(item)));
            if (favoriteItems.length > 0 && !searchQuery) {
                favoritesSectionEl.classList.remove('hidden');
                favoritesListEl.innerHTML = favoriteItems.map((item, index) => 
                    createRowHTML(item, index === favoriteItems.length - 1, true)
                ).join('');
            } else {
                favoritesSectionEl.classList.add('hidden');
            }

            // Render Categories
            categorySectionEl.innerHTML = '';
            const categories = {};
            filteredData.forEach(item => {
                const cat = item.category || 'General';
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(item);
            });

            Object.keys(categories).sort().forEach(category => {
                const catDiv = document.createElement('div');
                catDiv.className = "mb-8";
                const itemsHTML = categories[category].map((item, index) => 
                    createRowHTML(item, index === categories[category].length - 1)
                ).join('');
                
                catDiv.innerHTML = `
                    <div class="flex items-center gap-2 text-sm font-semibold text-notion-muted uppercase tracking-wider mb-2">
                        ${category}
                    </div>
                    <div class="border border-notion-border bg-notion-main">
                        <div class="flex flex-col">${itemsHTML}</div>
                    </div>
                `;
                categorySectionEl.appendChild(catDiv);
            });

            // Re-initialize all injected icons
            lucide.createIcons();
        }

        // --- 6. UTILITIES (COPY) ---
        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast(`Copied: ${text}`);
        }

        let toastTimeout;
        function showToast(message) {
            toastMessageEl.innerText = message;
            clearTimeout(toastTimeout);
            toastEl.classList.remove('translate-y-20', 'opacity-0');
            toastTimeout = setTimeout(() => {
                toastEl.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // --- 7. EVENT LISTENERS ---
        searchInputEl.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderContent();
        });

        filterToggleBtn.addEventListener('click', () => {
            showCategoryFilters = !showCategoryFilters;
            if (showCategoryFilters) {
                filterToggleBtn.classList.add('bg-notion-hover', 'text-notion-text');
                filterToggleBtn.classList.remove('text-notion-muted');
            } else {
                filterToggleBtn.classList.remove('bg-notion-hover', 'text-notion-text');
                filterToggleBtn.classList.add('text-notion-muted');
                selectedCategory = 'All'; // Reset filter when hiding
                renderContent();
            }
            renderCategoryBar();
        });

        mobileMenuBtn.addEventListener('click', () => {
            const isOpen = !sidebarEl.classList.contains('-translate-x-full');
            if (isOpen) {
                sidebarEl.classList.add('-translate-x-full');
                mobileMenuBtn.innerHTML = '<i data-lucide="menu" class="w-5 h-5"></i>';
            } else {
                sidebarEl.classList.remove('-translate-x-full');
                mobileMenuBtn.innerHTML = '<i data-lucide="x" class="w-5 h-5"></i>';
            }
            lucide.createIcons();
        });

        // Boot up
        initializeData();
    </script>
</body>
</html>
